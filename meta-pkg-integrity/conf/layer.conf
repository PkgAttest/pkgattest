# meta-pkg-integrity: package-aware integrity measurement for OpenBMC images.
# OCP Global Summit 2026 demo — per-package measurement, merkle root into TPM
# PCR, transparency-log publication (host tooling lives in ../pkg-integrity).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "pkg-integrity"
BBFILE_PATTERN_pkg-integrity = "^${LAYERDIR}/"
# Priority 5 == oe-core: recipe-version selection for dropbear must happen
# within one priority group (layer priority trumps version across groups),
# so oe-core's 2026.92 wins by default and DEFAULT_PREFERENCE=-1 keeps our
# 2026.91 demo recipe out unless PREFERRED_VERSION selects it (image B).
# bbappends apply regardless of priority.
BBFILE_PRIORITY_pkg-integrity = "5"

LAYERSERIES_COMPAT_pkg-integrity = "wrynose blacksail"
LAYERDEPENDS_pkg-integrity = "core phosphor-layer tpm-layer"
